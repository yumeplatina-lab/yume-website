<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人主頁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #7c5cbf;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(124, 92, 191, 0.3);
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .info-list {
            text-align: left;
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #444;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">✨</div>
        <h1>歡迎來到我的個人網站</h1>
        <p class="subtitle">Personal Portfolio Website</p>
        
        <div class="info-list">
            <div class="info-item">
                <span>專案名稱</span>
                <span class="tag">個人網頁部署</span>
            </div>
            <div class="info-item">
                <span>網站狀態</span>
                <span class="tag">已成功上線</span>
            </div>
            <div class="info-item">
                <span>託管平台</span>
                <span class="tag">GitHub Pages</span>
            </div>
        </div>

        <div class="social-links">
            <a href="https://github.com/yumeplatina-lab" class="btn" target="_blank">我的 GitHub</a>
        </div>
    </div>

</body>
</html>
